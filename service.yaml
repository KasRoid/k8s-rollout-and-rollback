apiVersion: v1
kind: Service
metadata:
  name: hello-app-svc
  labels:
    app: hello-app
    tier: frontend
  annotations:
    description: "hello-app 외부 접근용 NodePort 서비스"
spec:
  type: NodePort
  selector:
    app: hello-app
    tier: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
